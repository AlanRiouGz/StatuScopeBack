apiVersion: v1
kind: Service
metadata:
  name: statusscope-backend
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: statusscope-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ int .Values.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusscope-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ int .Values.replicas }}
  selector:
    matchLabels:
      app: statusscope-backend
  template:
    metadata:
      labels:
        app: statusscope-backend
    spec:
      automountServiceAccountToken: false
      {{- if .Values.registrySecretName }}
      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}
      {{- end }}
      containers:
        - name: statusscope-backend
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1536Mi
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: statusscope-llm
                optional: true
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.jdbcUrl | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecretName }}, key: username}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecretName }}, key: password}
            - name: FIREBASE_SA_PATH
              value: /var/run/secrets/firebase/service-account.json
            - name: CORS_ORIGINS
              value: {{ .Values.corsOrigins | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: '-XX:MaxRAMPercentage=70.0'
          volumeMounts:
            - name: firebase
              mountPath: /var/run/secrets/firebase
              readOnly: true
      volumes:
        - name: firebase
          secret:
            secretName: {{ .Values.firebaseSecretName }}
            defaultMode: 292
